# Hạ tầng chung của nhóm: PostgreSQL + Odoo + n8n + ngrok, chạy trên máy trưởng nhóm.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: postgres
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    image: odoo:${ODOO_VERSION:-19}
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${PG_USER}
      PASSWORD: ${PG_PASSWORD}
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${PG_USER}
      DB_POSTGRESDB_PASSWORD: ${PG_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_WEBHOOK_URL: https://${NGROK_DOMAIN}/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      TIKTOK_APP_KEY: ${TIKTOK_APP_KEY}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET}
      TIKTOK_API_BASE: ${TIKTOK_API_BASE:-https://open-api.tiktokglobalshop.com}
      TIKTOK_AUTH_BASE: ${TIKTOK_AUTH_BASE:-https://auth.tiktok-shops.com}
      TIKTOK_OAUTH_STATE: ${TIKTOK_OAUTH_STATE:-}
      ODOO_WEBHOOK_SECRET: ${ODOO_WEBHOOK_SECRET:-}
      KPI_SECRET: ${KPI_SECRET:-}
      GIA_LAP_MA: ${GIA_LAP_MA:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.8-27b}
      LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK:-openai/gpt-oss-120b}
      NLU_URL: ${NLU_URL:-}
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./backups:/backups
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    depends_on:
      - n8n
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "n8n:5678", "--url=${NGROK_DOMAIN}"]
    ports:
      - "127.0.0.1:4040:4040"
    restart: unless-stopped

  backup:
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASSWORD}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Ho_Chi_Minh
    entrypoint: ["bash", "/scripts/backup-loop.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - odoo-data:/odoo-data:ro
    restart: unless-stopped

  nlu:
    build: ./3-middleware-ai/nlu
    image: cntttmdt-nlu:latest
    profiles: ["nlu"]
    environment:
      MODEL_DIR: /models
      QUANTIZE: ${NLU_QUANTIZE:-1}
      TORCH_THREADS: ${NLU_THREADS:-2}
    volumes:
      - ${NLU_MODEL_DIR:-./3-middleware-ai/nlu/outputs}:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 1500m
    restart: unless-stopped

volumes:
  db-data: {}
  odoo-data: {}
  n8n-data: {}
